services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      AUTOLEARN_ADMIN_KEY: ${AUTOLEARN_ADMIN_KEY:?set a long random platform admin key}
      AUTOLEARN_LEARN_INTERVAL: "15"
      AUTOLEARN_LLM_LOG_RETENTION_DAYS: "30"
    volumes:
      - autolearn-data:/data
      - ./models/llm:/models/llm
      - ./models/open:/models/open:ro
    restart: unless-stopped

  # Fine-tunes the LLM from opted-in customer feedback and hot-swaps the API to better versions.
  llm-learner:
    build: .
    command: ["python", "-m", "autolearn.llm.continual", "--data-dir", "/data", "--llm-dir", "/models/llm",
              "--replay", "/sft", "--interval", "900"]
    volumes:
      - autolearn-data:/data
      - ./models/llm:/models/llm
      - ./data/llm/sft:/sft:ro
    restart: unless-stopped
    depends_on: [api]

  # Trains each customer's custom model (LoRA adapter on autolearn-pro) from their examples and feedback.
  custom-trainer:
    build: .
    command: ["python", "-m", "autolearn.llm.custom", "--data-dir", "/data", "--open-dir", "/models/open",
              "--interval", "300"]
    volumes:
      - autolearn-data:/data
      - ./models/open:/models/open:ro
    restart: unless-stopped
    depends_on: [api]

volumes:
  autolearn-data:
